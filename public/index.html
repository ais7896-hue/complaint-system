<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>品質客訴登記表單</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 24px 16px; color: #333; }
    .container { max-width: 960px; margin: 0 auto; }
    .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .nav-title { font-size: 20px; font-weight: 700; color: #0f172a; margin: 0; }
    .btn-nav { background: #fff; color: #2563eb; border: 1px solid #cbd5e1; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 600; text-decoration: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-nav:hover { background: #f8fafc; border-color: #2563eb; }
    .card { background: #fff; border-radius: 8px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card h2 { margin-top: 0; margin-bottom: 20px; color: #1e293b; font-size: 18px; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 16px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group.full-width { grid-column: 1 / -1; }
    label { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #475569; }
    label span.req { color: #e11d48; }
    input, select, textarea { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; transition: border 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
    input[readonly] { background-color: #f1f5f9; cursor: not-allowed; }
    .btn-submit { background: #2563eb; color: #fff; border: none; padding: 12px 28px; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; width: 100%; margin-top: 8px; }
    .btn-submit:hover { background: #1d4ed8; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="container">
  <div class="nav-bar">
    <h1 class="nav-title">品質客訴異常管理系統</h1>
    <a href="/list.html" class="btn-nav">📋 查看客訴清單</a>
  </div>

  <div class="card">
    <h2>品質客訴登記表單</h2>
    <form id="complaintForm">
      <div class="form-grid">
        <div class="form-group">
          <label>內部管制編號 (NO)</label>
          <input type="text" name="no" placeholder="例如：NO-2026-001">
        </div>
        <div class="form-group">
          <label>立案日期 <span class="req">*</span></label>
          <input type="date" name="complaint_date" required id="defaultDate">
        </div>
        <div class="form-group">
          <label>客訴單號 <span class="req">*</span></label>
          <input type="text" name="form_no" placeholder="例如：CR-2610-01" required>
        </div>
        <div class="form-group">
          <label>客戶別 <span class="req">*</span></label>
          <input type="text" name="customer_name" placeholder="例如：宏碁 / 華碩" required>
        </div>
        <div class="form-group">
          <label>產品類別</label>
          <input type="text" name="product_category" placeholder="例如：風速儀、感測板">
        </div>
        <div class="form-group">
          <label>機種名稱/型號 <span class="req">*</span></label>
          <input type="text" name="model_name" placeholder="例如：Model-X300" required>
        </div>
        <div class="form-group">
          <label>出貨日</label>
          <input type="date" name="shipment_date">
        </div>
        <div class="form-group">
          <label>客訴類型</label>
          <select name="complaint_type">
            <option value="外觀瑕疵">外觀瑕疵</option>
            <option value="功能失效">功能失效</option>
            <option value="尺寸不良">尺寸不良</option>
            <option value="組裝不良">組裝不良</option>
            <option value="出貨缺漏">出貨缺漏</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div class="form-group">
          <label>檢驗數</label>
          <input type="number" id="inspQty" name="inspection_qty" value="0" min="0">
        </div>
        <div class="form-group">
          <label>不良數</label>
          <input type="number" id="defQty" name="defect_qty" value="0" min="0">
        </div>
        <div class="form-group">
          <label>不良率 (%)</label>
          <input type="text" id="defRate" readonly placeholder="自動計算">
        </div>
        <div class="form-group">
          <label>責任單位</label>
          <input type="text" name="responsible_dept" placeholder="例如：產線、品保、外包廠">
        </div>
        <div class="form-group">
          <label>結案狀態</label>
          <select name="is_closed">
            <option value="未結案" selected>未結案</option>
            <option value="處理中">處理中</option>
            <option value="已結案">已結案</option>
          </select>
        </div>
        <div class="form-group">
          <label>CAPA (預防措施單號)</label>
          <input type="text" name="capa" placeholder="例如：CAPA-2026001">
        </div>

        <div class="form-group full-width">
          <label>異常內容詳細描述 <span class="req">*</span></label>
          <textarea name="anomaly_content" rows="3" required placeholder="請具體說明不良現象與發生的檢驗環節"></textarea>
        </div>
        <div class="form-group full-width">
          <label>原因分析</label>
          <textarea name="root_cause" rows="2" placeholder="說明根本原因 (Root Cause)"></textarea>
        </div>
        <div class="form-group full-width">
          <label>改善對策</label>
          <textarea name="countermeasure" rows="2" placeholder="說明短長期改善行動"></textarea>
        </div>
        <div class="form-group full-width">
          <label>追蹤確認</label>
          <textarea name="tracking_confirmation" rows="2" placeholder="追蹤成效驗證狀況"></textarea>
        </div>
        <div class="form-group full-width">
          <label>備註 (案子進度)</label>
          <textarea name="progress_notes" rows="2" placeholder="備忘或後續排程紀錄"></textarea>
        </div>
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">儲存客訴資料</button>
    </form>
  </div>
</div>

<script>
  // 預設日期為今天
  document.getElementById('defaultDate').value = new Date().toISOString().split('T')[0];

  // 自動計算不良率
  const inspInput = document.getElementById('inspQty');
  const defInput = document.getElementById('defQty');
  const rateInput = document.getElementById('defRate');

  function calculateRate() {
    const insp = parseInt(inspInput.value, 10) || 0;
    const def = parseInt(defInput.value, 10) || 0;
    if (insp > 0) {
      rateInput.value = ((def / insp) * 100).toFixed(2) + ' %';
    } else {
      rateInput.value = '0.00 %';
    }
  }
  inspInput.addEventListener('input', calculateRate);
  defInput.addEventListener('input', calculateRate);

  // 表單送出
  document.getElementById('complaintForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '儲存中...';

    const formData = new FormData(e.target);
    const payload = Object.fromEntries(formData.entries());

    try {
      const res = await fetch('/api/complaints', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const result = await res.json();
      if (!res.ok) throw new Error(result.error || '儲存失敗');

      if (confirm('客訴案件已成功建立！是否立即前往查看案件清單？')) {
        window.location.href = '/list.html';
      } else {
        e.target.reset();
        document.getElementById('defaultDate').value = new Date().toISOString().split('T')[0];
        calculateRate();
      }
    } catch (err) {
      alert('錯誤: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '儲存客訴資料';
    }
  });
</script>

</body>
</html>
