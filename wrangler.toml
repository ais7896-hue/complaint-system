name = "complaint-system"
main = "src/index.js"
compatibility_date = "2024-04-01"

[assets]
directory = "./public"
binding = "ASSETS"

# Cloudflare D1 綁定設定
# 請至 Cloudflare 建立 D1 (名稱: complaint-db)，並在後台 Bindings 或此處填寫 database_id
[[d1_databases]]
binding = "DB"
database_name = "complaint-db"
database_id = "complaint-db"
