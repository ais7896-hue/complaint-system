name = "complaint-system"
main = "src/index.js"
compatibility_date = "2024-04-01"

[assets]
directory = "./public"
binding = "ASSETS"

# 注意：線上部署建議直接在 Cloudflare 控制台的「Settings > Bindings」綁定 D1 (變數名稱: DB)
# 若要在此處寫入，database_id 必須是真實的 UUID (例如: 12345678-abcd-1234-ef01-123456789abc)
# [[d1_databases]]
# binding = "DB"
# database_name = "complaint-db"
# database_id = "your-actual-d1-uuid-here"
